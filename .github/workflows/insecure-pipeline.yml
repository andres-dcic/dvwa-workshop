name: ⚠️ INSECURE Pipeline (Multi-Job Demo)

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  # ========== JOB 1: GITLEAKS ==========
  gitleaks-scan:
    runs-on: ubuntu-latest
    name: 🔐 Gitleaks - Detect Secrets

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔍 Scan for hardcoded secrets
        id: gitleaks
        continue-on-error: true
        run: |
          echo "🔍 Scanning app-insecure.js for secrets..."
          docker run \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect --source /repo --verbose 2>&1 || true
          echo "⚠️ Gitleaks: Secrets may have been detected but pipeline continues"

  # ========== JOB 2: SEMGREP (Depends on Gitleaks) ==========
  semgrep-scan:
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    name: 🔍 Semgrep - Code Vulnerabilities

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 📋 Analyze app-insecure.js for vulnerabilities
        id: semgrep
        continue-on-error: true
        run: |
          echo "🔍 Analyzing app-insecure.js..."
          docker run \
            -v ${{ github.workspace }}:/src \
            returntocorp/semgrep \
            semgrep \
              --config=p/owasp-top-ten \
              --json \
              /src 2>&1 || true
          echo "⚠️ Semgrep: Vulnerabilities may have been detected but pipeline continues"

  # ========== JOB 3: TRIVY (Depends on Semgrep) ==========
  trivy-scan:
    runs-on: ubuntu-latest
    needs: semgrep-scan
    name: 📦 Trivy - Dependency Vulnerabilities

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Scan dependencies in app-insecure.js
        id: trivy
        continue-on-error: true
        run: |
          echo "📦 Scanning dependencies for known CVEs..."
          docker run \
            -v ${{ github.workspace }}:/root/scan \
            aquasec/trivy:latest \
            fs /root/scan \
            --severity CRITICAL,HIGH 2>&1 || true
          echo "⚠️ Trivy: Vulnerabilities detected but pipeline continues"

  # ========== FINAL STATUS ==========
  pipeline-status:
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, semgrep-scan, trivy-scan]
    if: always()
    name: 📊 Pipeline Summary

    steps:
      - name: 📋 Execution Summary
        run: |
          echo "════════════════════════════════════════"
          echo "📊 INSECURE PIPELINE EXECUTION SUMMARY"
          echo "════════════════════════════════════════"
          echo ""
          echo "Job Results:"
          echo "  🔐 Gitleaks:  ${{ needs.gitleaks-scan.result }}"
          echo "  🔍 Semgrep:   ${{ needs.semgrep-scan.result }}"
          echo "  📦 Trivy:     ${{ needs.trivy-scan.result }}"
          echo ""
          echo "════════════════════════════════════════"
          echo "⚠️  ALL JOBS CONTINUED DESPITE FINDINGS"
          echo "⚠️  THIS IS AN INSECURE PIPELINE"
          echo "════════════════════════════════════════"
          echo ""
          echo "This demonstrates the risk of:"
          echo "  ❌ Using continue-on-error: true"
          echo "  ❌ Allowing vulnerabilities to reach production"
          echo "  ❌ Not blocking on security findings"

